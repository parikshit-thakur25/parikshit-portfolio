<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e041c" />
      <stop offset="100%" stop-color="#050109" />
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect x="20" y="20" width="472" height="472" rx="110" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="20" />

  <!-- Monogram "PT" in Pure Crisp White -->
  <text x="230" y="325" font-family="-apple-system, BlinkMacSystemFont, 'Outfit', 'Inter', Arial, sans-serif" font-size="220" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="-6">PT</text>

  <!-- Glowing Violet Dot Accent -->
  <circle cx="376" cy="305" r="22" fill="#c084fc" filter="url(#neonGlow)" />
</svg>
